<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Smart Attendance Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h2>Smart Attendance Portal</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="notices.html">Notices</a>
            <a href="timetable.html">Timetable</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
        </nav>

    </header>

    <!-- Login Section -->
    <section class="container">

        <h1 style="text-align:center;">
            Student Login
        </h1>

        <div class="login-box">

            <h2>Welcome Back!</h2>

            <p>Please enter your details to continue.</p>

            <form action="#" method="post">

                <label for="studentid">
                    Student ID / Roll Number
                </label>

                <input
                    type="text"
                    id="studentid"
                    name="studentid"
                    placeholder="Enter your Roll Number"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    required
                >

                <label for="course">
                    Select Course
                </label>

                <select id="course" name="course" required>

                    <option value="">Select Course</option>

                    <option value="ETCE">
                        B.Tech ETCE
                    </option>

                    <option value="CSE">
                        B.Tech CSE
                    </option>

                    <option value="ECE">
                        B.Tech ECE
                    </option>

                </select>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <p class="small-note">
                This is a demonstration login page
                created using HTML and CSS.
            </p>

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p>Smart Attendance Portal</p>

        <p>Created by Himanshu</p>

        <p>Branch: ETCE 1st Year</p>

        <p>Roll Number: 264011</p>

    </footer>

</body>
</html>
